[build-system]
# Pinned to one reviewed version (84.2.1: past every advisory published up to 2026-10-26, latest GHSA-xmj3-9gf7-h52w). claim-seal
# has no runtime dependencies; this is only what builds the sdist and wheel.
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-seal"
version = "0.2.0"
description = "Check each claim against the sources it cites, record where the writing steps beyond them, and seal the claim-evidence rows (not the verdicts or sentence labels) in a SHA-256 digest chain."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
claim-seal = "claim_seal.cli:main"

[tool.setuptools]
packages = ["claim_seal"]
